name: Publish ganttcraft to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Verify release tag and branch
        run: |
          node scripts/verify-release.mjs
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ganttcraft lint
      - run: pnpm --filter ganttcraft test
      - run: pnpm --filter ganttcraft build
      - run: pnpm --filter ganttcraft check:examples

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ganttcraft-dist
          path: packages/ganttcraft/dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: ganttcraft-dist
          path: packages/ganttcraft/dist

      - name: Publish with npm trusted publishing
        working-directory: packages/ganttcraft
        run: |
          test -f dist/ganttcraft.js
          test -f dist/ganttcraft.cjs
          test -f dist/index.d.ts
          npm publish --access public --ignore-scripts
